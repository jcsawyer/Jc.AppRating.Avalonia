on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-preview[0-9][0-9][0-9]"

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_VERSION: 10.0.x
  # This workload set targets Xcode 26.6, available on the macOS 26 runners.
  DOTNET_WORKLOAD_VERSION: 10.0.401
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Report toolchain versions
        run: |
          dotnet --info
          xcodebuild -version
      - name: Restore workloads
        run: |
          dotnet workload restore jc-apprating-avalonia-samples.sln --version ${{ env.DOTNET_WORKLOAD_VERSION }}
          dotnet workload --info
      - name: Set VERSION variable from tag
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV
      - name: Build
        run: dotnet build jc-apprating-avalonia.sln --configuration Release /p:Version=${VERSION}
      - name: Build Android sample
        run: dotnet build Jc.AppRating.Avalonia.Sample/Jc.AppRating.Avalonia.Sample.Android/Jc.AppRating.Avalonia.Sample.Android.csproj --configuration Release /p:Version=${VERSION}
      - name: Build unsigned iOS simulator sample
        run: dotnet build Jc.AppRating.Avalonia.Sample/Jc.AppRating.Avalonia.Sample.iOS/Jc.AppRating.Avalonia.Sample.iOS.csproj --configuration Release /p:Version=${VERSION} -p:RuntimeIdentifier=iossimulator-arm64 -p:EnableCodeSigning=false
      - name: Pack
        run: dotnet pack jc-apprating-avalonia.sln --configuration Release /p:Version=${VERSION} --no-build --output artifacts
      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_APIKEY }}
